<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Gradientes para dar volume e tom realista aos tons de marrom -->
    <linearGradient id="cakeBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5A2B" />
      <stop offset="50%" stop-color="#703F17" />
      <stop offset="100%" stop-color="#5C3317" />
    </linearGradient>

    <linearGradient id="frostingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D2B48C" />
      <stop offset="100%" stop-color="#A0805C" />
    </linearGradient>

    <linearGradient id="cherryGrad" x1="30%" y1="20%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#FF4D4D" />
      <stop offset="50%" stop-color="#CC0000" />
      <stop offset="100%" stop-color="#800000" />
    </linearGradient>

    <linearGradient id="bowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D2B48C" />
      <stop offset="100%" stop-color="#8B5A2B" />
    </linearGradient>

    <!-- Sombra suave embaixo do bolo -->
    <ellipse id="shadow" cx="200" cy="355" rx="110" ry="18" fill="#E6D7C3" />
  </defs>

  <!-- Fundo opcional suave, destacando o marrom -->
  <rect width="100%" height="100%" fill="#FAF6F0" rx="20" />

  <!-- Sombra do Bolo -->
  <use href="#shadow" />

  <!-- Prato do bolo -->
  <g id="plate">
    <ellipse cx="200" cy="350" rx="140" ry="25" fill="#EAE0D0" stroke="#D1C2AD" stroke-width="3" />
    <ellipse cx="200" cy="346" rx="125" ry="18" fill="#F5EFE6" />
  </g>

  <!-- Corpo do Bolo (Esponja de Chocolate/Marrom) -->
  <path d="M 110,210 
           L 110,320 
           Q 200,345 290,320 
           L 290,210 
           Z" fill="url(#cakeBodyGrad)" />

  <!-- Camada de recheio / detalhe marrom claro -->
  <path d="M 115,260 Q 200,280 285,260 L 285,280 Q 200,300 115,280 Z" fill="#653716" opacity="0.6" />

  <!-- Cobertura / Ganache escorrendo (Dripping Frosting) -->
  <path d="M 110,210 
           Q 110,190 125,190
           L 275,190
           Q 290,190 290,210
           Q 290,230 280,235
           Q 275,260 260,250
           Q 250,230 240,245
           Q 225,270 210,245
           Q 200,230 190,245
           Q 175,270 160,245
           Q 150,230 140,245
           Q 125,260 120,235
           Q 110,230 110,210 Z" fill="url(#frostingGrad)" />

  <!-- Decoração: Lacinho em tom de marrom/bege no topo do bolo -->
  <g id="bow" transform="translate(200, 185)">
    <!-- Laço - Lado Esquerdo -->
    <path d="M 0,0 C -25,-25 -40,0 -20,20 C -10,10 -5,5 0,0 Z" fill="url(#bowGrad)" stroke="#5C3317" stroke-width="1.5" />
    <!-- Laço - Lado Direito -->
    <path d="M 0,0 C 25,-25 40,0 20,20 C 10,10 5,5 0,0 Z" fill="url(#bowGrad)" stroke="#5C3317" stroke-width="1.5" />
    <!-- Nó Central do Laço -->
    <circle cx="0" cy="2" r="6" fill="#703F17" stroke="#5C3317" stroke-width="1.5" />
    <!-- Fitas penduradas do laço -->
    <path d="M -5,6 L -15,25 L -5,22 Z" fill="#8B5A2B" />
    <path d="M 5,6 L 15,25 L 5,22 Z" fill="#8B5A2B" />
  </g>

  <!-- Cereja no Topo -->
  <g id="cherry" transform="translate(200, 155)">
    <!-- Cabinho da Cereja -->
    <path d="M 0,-5 C 10,-25 25,-35 40,-30" fill="none" stroke="#4A7C2D" stroke-width="3" stroke-linecap="round" />
    <!-- Folhinha da Cereja -->
    <path d="M 22,-27 C 30,-35 40,-30 35,-20 C 28,-18 20,-22 22,-27 Z" fill="#669933" />
    <!-- Corpo da Cereja -->
    <circle cx="0" cy="5" r="16" fill="url(#cherryGrad)" />
    <!-- Brilho da Cereja -->
    <ellipse cx="-5" cy="0" rx="4" ry="6" transform="rotate(-30 -5 0)" fill="#FFFFFF" opacity="0.7" />
  </g>

</svg>